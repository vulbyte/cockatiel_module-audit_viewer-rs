[package]
name = "cockatiel_audit_viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
cockatiel-client = { git = "https://github.com/vulbyte/cockatiel_client-rs", rev = "a37fe0e2ba5fad13b417cfdbbf067a95b3844249" }
tokio = { version = "1.0", features = ["full"] }
